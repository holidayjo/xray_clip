# Dataset root directory
image_root: data/nih_images

# CSV file splits
train_csv: data/cxr8/PruneCXR/miccai2023_nih-cxr-lt_labels_train.csv
valid_csv: data/cxr8/PruneCXR/miccai2023_nih-cxr-lt_labels_val.csv
test_csv : data/cxr8/PruneCXR/miccai2023_nih-cxr-lt_labels_test.csv

# Single target class for this experiment: Nodule vs. everything else.
top_labels:
  - Nodule

# Text prompt template used to build the per-label CLIP text prototype.
# {label} is substituted with each entry of top_labels. Must stay identical
# between train_nodule_balanced.py and any evaluation of its checkpoints.
prompt_template: "A chest radiograph with {label}, characterized by specific radiological features in the pulmonary area, affecting the thoracic cavity."

# All original 20 labels in the NIH dataset
all_labels:
  - Atelectasis
  - Cardiomegaly
  - Consolidation
  - Edema
  - Effusion
  - Emphysema
  - Fibrosis
  - Hernia
  - Infiltration
  - Mass
  - Nodule
  - Pleural Thickening
  - Pneumonia
  - Pneumothorax
  - Pneumoperitoneum
  - Pneumomediastinum
  - Subcutaneous Emphysema
  - Tortuous Aorta
  - Calcification of the Aorta
  - No Finding

