# Dataset root directory
image_root: data/nih_images

# # CSV file splits
# train_csv: data/cxr8/PruneCXR/miccai2023_nih-cxr-lt_labels_train.csv
# valid_csv: data/cxr8/PruneCXR/miccai2023_nih-cxr-lt_labels_val.csv
# test_csv : data/cxr8/PruneCXR/miccai2023_nih-cxr-lt_labels_test.csv

# Original ChestX-ray14 release files. 
data_entry_csv: data/cxr8/Data_Entry_2017_v2020.csv
train_val_list: data/cxr8/train_val_list.txt
test_list     : data/cxr8/test_list.txt


# Target classes for training (top_labels).
# These are the 9 diseases selected by the reference paper (Mezina & Burget, 2024, Detection of post-COVID-19-related pulmonary diseases in X-ray images using Vision Transformer-based neural network"),
# so results here are directly comparable to its Table 3 / Table 4. Must stay in the same order as train_resnet_baseline.py's PAPER_LABELS, 
# since pos_weight and the model's output logits are both ordered by it.
top_labels:
  - Cardiomegaly
  - Consolidation
  - Edema
  - Effusion
  - Emphysema
  - Fibrosis
  - Infiltration
  - Nodule
  - Pneumothorax
  # - Atelectasis
  # - Cardiomegaly
  # - Consolidation
  # - Edema
  # - Effusion
  # - Emphysema
  # - Fibrosis
  # - Hernia
  # - Infiltration
  # - Mass
  # - Nodule
  # - Pleural Thickening
  # - Pneumonia
  # - Pneumothorax
  # - Pneumoperitoneum
  # - Pneumomediastinum
  # - Subcutaneous Emphysema
  # - Tortuous Aorta
  # - Calcification of the Aorta
  # - No Finding

# Text prompt template.
prompt_template: "A chest radiograph with {label}, characterized by specific radiological features in the pulmonary area, affecting the thoracic cavity."

# All original 20 labels in the NIH dataset
all_labels:
  - Atelectasis
  - Cardiomegaly
  - Consolidation
  - Edema
  - Effusion
  - Emphysema
  - Fibrosis
  - Hernia
  - Infiltration
  - Mass
  - Nodule
  - Pleural Thickening
  - Pneumonia
  - Pneumothorax
  - Pneumoperitoneum
  - Pneumomediastinum
  - Subcutaneous Emphysema
  - Tortuous Aorta
  - Calcification of the Aorta
  - No Finding

